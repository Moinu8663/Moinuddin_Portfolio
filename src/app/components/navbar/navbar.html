<header class="navbar" [class.scrolled]="scrolled()">
  <div class="nav-inner">

    <a class="logo" routerLink="/">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-text">MS</span>
      <span class="logo-bracket">/&gt;</span>
    </a>

    <nav class="nav-links" [class.open]="menuOpen()">
      <div class="nav-backdrop" (click)="closeMenu()"></div>
      <div class="nav-drawer">
        @for (link of navLinks; track link.label) {
          <a class="nav-link"
             [routerLink]="link.path"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: link.path === '/' }"
             (click)="closeMenu()">
            {{ link.label }}
          </a>
        }
        <a routerLink="/contact" class="nav-cta" (click)="closeMenu()">Hire Me</a>
      </div>
    </nav>

    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <span class="bar" [class.open]="menuOpen()"></span>
    </button>
  </div>
</header>
